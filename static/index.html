<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pulso-chat — v0.2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #121214;
      color: #e1e1e6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #18181b;
      border-bottom: 1px solid #27272a;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #04d361;
    }
    .user-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      min-height: 0;
    }
    aside {
      background: #18181b;
      border-right: 1px solid #27272a;
      padding: 14px;
      overflow-y: auto;
    }
    aside.right {
      border-right: none;
      border-left: 1px solid #27272a;
    }
    aside h3 {
      margin: 0 0 10px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #a1a1aa;
    }
    .room-btn {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: #d4d4d8;
      cursor: pointer;
    }
    .room-btn:hover { background: #27272a; }
    .room-btn.active {
      background: #2e1065;
      border-color: #8257e5;
      color: #fff;
      font-weight: 600;
    }
    .online-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      font-size: 0.9rem;
    }
    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    main {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .room-header {
      padding: 10px 18px;
      border-bottom: 1px solid #27272a;
      font-weight: 600;
      background: #141417;
    }
    #messages {
      flex: 1;
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      background: #202024;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 75%;
      word-break: break-word;
    }
    .msg-meta {
      font-size: 0.75rem;
      color: #a1a1aa;
      margin-bottom: 3px;
    }
    .msg-meta strong { color: #c4b5fd; }
    .sys-msg {
      font-size: 0.82rem;
      color: #a1a1aa;
      text-align: center;
      padding: 4px 0;
    }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      background: #18181b;
      border-top: 1px solid #27272a;
    }
    input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background: #202024;
      color: #fff;
    }
    .composer input { flex: 1; }
    button.primary {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background: #8257e5;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:hover { background: #996dff; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> pulso-chat <small style="color:#a1a1aa;font-weight:400;">v0.2</small></div>
    <div class="user-bar">
      <label for="nick" style="font-size:0.85rem;color:#a1a1aa;">Nick:</label>
      <input id="nick" type="text" value="Fred" maxlength="24" style="width:140px;" />
      <button class="primary" onclick="reconnect()">Entrar</button>
    </div>
  </header>

  <div class="layout">
    <aside>
      <h3>Salas</h3>
      <div id="roomsList"></div>
      <div style="margin-top:12px;display:flex;gap:6px;">
        <input id="newRoom" type="text" placeholder="nova-sala" style="width:100%;padding:6px 8px;font-size:0.85rem;" />
        <button class="primary" style="padding:6px 10px;font-size:0.85rem;" onclick="createAndJoinRoom()">+</button>
      </div>
    </aside>

    <main>
      <div class="room-header" id="currentRoomTitle"># geral</div>
      <div id="messages"></div>
      <div class="composer">
        <input id="msgInput" type="text" placeholder="Digite sua mensagem..." />
        <button class="primary" onclick="sendMessage()">Enviar</button>
      </div>
    </main>

    <aside class="right">
      <h3>Online na sala (<span id="onlineCount">0</span>)</h3>
      <div id="onlineList"></div>
    </aside>
  </div>

  <script>
    let ws = null;
    let currentRoom = "geral";
    let knownRooms = ["geral", "dev", "aleatorio"];

    const nickInput = document.getElementById("nick");
    const messagesEl = document.getElementById("messages");
    const msgInput = document.getElementById("msgInput");
    const roomsListEl = document.getElementById("roomsList");
    const onlineListEl = document.getElementById("onlineList");
    const onlineCountEl = document.getElementById("onlineCount");
    const roomTitleEl = document.getElementById("currentRoomTitle");

    function renderRooms(rooms) {
      if (Array.isArray(rooms) && rooms.length) {
        knownRooms = rooms;
      }
      roomsListEl.innerHTML = "";
      knownRooms.forEach((room) => {
        const btn = document.createElement("button");
        btn.className = "room-btn" + (room === currentRoom ? " active" : "");
        btn.textContent = `# ${room}`;
        btn.onclick = () => switchRoom(room);
        roomsListEl.appendChild(btn);
      });
    }

    function renderOnline(users) {
      const list = Array.isArray(users) ? users : [];
      onlineCountEl.textContent = list.length;
      onlineListEl.innerHTML = "";
      list.forEach((user) => {
        const row = document.createElement("div");
        row.className = "online-item";
        row.innerHTML = `<span class="online-dot"></span><span>${escapeHtml(user)}</span>`;
        onlineListEl.appendChild(row);
      });
    }

    function addSystemMessage(text, time) {
      const div = document.createElement("div");
      div.className = "sys-msg";
      div.textContent = `${time ? `[${time}] ` : ""}${text}`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addChatMessage(sender, text, time) {
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `
        <div class="msg-meta"><strong>${escapeHtml(sender)}</strong> · ${escapeHtml(time || "")}</div>
        <div>${escapeHtml(text)}</div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function connect(room = currentRoom) {
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      currentRoom = (room || "geral").trim().toLowerCase() || "geral";
      roomTitleEl.textContent = `# ${currentRoom}`;
      messagesEl.innerHTML = "";
      renderRooms(knownRooms);

      const nick = encodeURIComponent(nickInput.value.trim() || "Anônimo");
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${protocol}://${location.host}/ws/${encodeURIComponent(currentRoom)}?nickname=${nick}`);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "presence") {
          renderRooms(data.rooms);
          renderOnline(data.online);
          const action = data.event === "join" ? "entrou na sala" : "saiu da sala";
          addSystemMessage(`${data.nickname} ${action}`, data.timestamp);
        } else if (data.type === "message") {
          addChatMessage(data.sender, data.text, data.timestamp);
        }
      };

      ws.onclose = () => {
        addSystemMessage("Desconectado da sala.");
      };
    }

    function reconnect() {
      connect(currentRoom);
    }

    function switchRoom(room) {
      connect(room);
    }

    function createAndJoinRoom() {
      const input = document.getElementById("newRoom");
      const raw = input.value.trim().toLowerCase().replace(/\s+/g, "-");
      if (!raw) return;
      input.value = "";
      if (!knownRooms.includes(raw)) {
        knownRooms.push(raw);
      }
      connect(raw);
    }

    function sendMessage() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const text = msgInput.value.trim();
      if (!text) return;
      ws.send(JSON.stringify({ type: "message", text }));
      msgInput.value = "";
    }

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    connect("geral");
  </script>
</body>
</html>
