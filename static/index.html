<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pulso-chat — v0.1</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
      background: #121214;
      color: #e1e1e6;
    }
    h2 {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #04d361;
      display: inline-block;
    }
    #log {
      background: #202024;
      padding: 12px;
      border-radius: 6px;
      height: 220px;
      overflow-y: auto;
      margin-bottom: 12px;
      font-family: monospace;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 4px;
      border: 1px solid #323238;
      background: #202024;
      color: #fff;
    }
    button {
      padding: 10px 16px;
      border-radius: 4px;
      border: none;
      background: #8257e5;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #996dff;
    }
  </style>
</head>
<body>
  <h2><span class="dot"></span> pulso-chat <small>(v0.1)</small></h2>
  <div id="log"></div>
  <div class="controls">
    <input id="msg" type="text" placeholder="Digite algo para testar o pulso..." />
    <button onclick="sendMsg()">Enviar</button>
  </div>

  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("msg");
    const ws = new WebSocket(`ws://${location.host}/ws`);

    function appendLog(text) {
      const line = document.createElement("div");
      line.textContent = text;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }

    ws.onopen = () => appendLog("[sistema] Conexão WebSocket aberta.");
    ws.onmessage = (event) => appendLog(event.data);
    ws.onclose = () => appendLog("[sistema] Conexão encerrada.");

    function sendMsg() {
      if (!input.value.trim()) return;
      ws.send(input.value);
      input.value = "";
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMsg();
    });
  </script>
</body>
</html>
